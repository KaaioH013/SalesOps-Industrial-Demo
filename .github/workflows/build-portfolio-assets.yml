name: Build portfolio assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-portfolio-assets.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/capture-portfolio.mjs"
      - "db/**"
      - "app/**"
      - "components/**"
      - "features/**"
      - "lib/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[skip portfolio assets]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate the lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare synthetic local database
        env:
          TURSO_DATABASE_URL: file:./local.db
          AUTH_SECRET: portfolio-github-actions-secret
          CRON_SECRET: portfolio-github-actions-secret
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture portfolio views
        run: npm run capture:portfolio

      - name: Commit generated portfolio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json docs/portfolio/images
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh portfolio assets [skip portfolio assets]"
            git push
          fi
